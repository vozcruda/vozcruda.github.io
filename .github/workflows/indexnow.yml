# Tells Bing, Yandex and other IndexNow search engines about every URL in the sitemap after each push,
# so new and updated guides are recrawled quickly. Bing's index also feeds ChatGPT search and Copilot.
# The key file at the site root (78888b40451e82693e4b8c120581e4a4.txt) proves we own vozcruda.com.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap*.xml", "llms*.txt"]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>(.*?)</loc>", open("sitemap-pages.xml").read())
          urls += ["https://vozcruda.com/llms.txt", "https://vozcruda.com/llms-full.txt"]
          body = json.dumps({"host": "vozcruda.com", "key": "78888b40451e82693e4b8c120581e4a4",
                             "keyLocation": "https://vozcruda.com/78888b40451e82693e4b8c120581e4a4.txt",
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req) as r:
              print(r.status, f"submitted {len(urls)} URLs")
          PY
